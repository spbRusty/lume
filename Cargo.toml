[workspace]
resolver = "3"
members = ["crates/lume-core", "crates/lume-llm", "crates/lume-mcp", "crates/lume-agent", "crates/lume-orchestrator", "crates/lume-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/spbRusty/lume"

[workspace.dependencies]
lume-core = { path = "crates/lume-core" }
lume-llm = { path = "crates/lume-llm" }
lume-mcp = { path = "crates/lume-mcp" }
lume-agent = { path = "crates/lume-agent" }
lume-orchestrator = { path = "crates/lume-orchestrator" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
